name: Xpeng
description: 'XPENG (Xiaopeng Motors) is a Chinese smart electric-vehicle company headquartered
  in Guangzhou that designs and manufactures smart EVs (G6, G7, G9, P7/P7+, X9, MONA M03) with
  in-house advanced driver-assistance and in-car software, listed on the NYSE (XPEV) and HKEX
  (9868). Surfaced as a portfolio company of hongshan and idg-capital. XPENG publishes no public
  developer API: its open platform (open.xiaopeng.com) is geo-restricted and account-gated, and
  no public API docs, specs, or SDKs were found.'
